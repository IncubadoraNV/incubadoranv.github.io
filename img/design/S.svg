<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="132" viewBox="0 0 1536 132">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#173f20"/>
    <stop offset="50%" stop-color="#0d4d38"/>
    <stop offset="100%" stop-color="#163f22"/>
  </linearGradient>
</defs>

<rect x="4" y="4" width="1528" height="124" rx="18" fill="url(#bg)"/>

<!-- Left badge -->
<circle cx="68" cy="66" r="36" fill="#6f9623"/>
<g stroke="white" fill="none" stroke-width="2">
  <path d="M68 90 L68 42"/>
  <path d="M68 55 C60 55 58 48 58 44 C64 44 68 48 68 55"/>
  <path d="M68 55 C76 55 78 48 78 44 C72 44 68 48 68 55"/>
  <path d="M68 70 C58 70 54 62 54 58 C62 58 68 62 68 70"/>
  <path d="M68 70 C78 70 82 62 82 58 C74 58 68 62 68 70"/>
</g>

<text x="140" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#8dc63f">7 municípios.</text>
<text x="140" y="78" font-family="Arial, sans-serif" font-size="24" fill="white">Um território fértil</text>
<text x="140" y="105" font-family="Arial, sans-serif" font-size="24" fill="white">para grandes ideias.</text>

<!-- separators -->
<g stroke="rgba(255,255,255,.3)" stroke-width="1">
  <line x1="450" y1="22" x2="450" y2="110" stroke="#6b8a6d"/>
  <line x1="725" y1="22" x2="725" y2="110" stroke="#6b8a6d"/>
  <line x1="1010" y1="22" x2="1010" y2="110" stroke="#6b8a6d"/>
  <line x1="1265" y1="22" x2="1265" y2="110" stroke="#6b8a6d"/>
</g>

<!-- Column 1 -->
<g transform="translate(520,34)">
  <circle cx="0" cy="0" r="4" stroke="white" fill="none"/>
  <circle cx="-14" cy="8" r="4" stroke="white" fill="none"/>
  <circle cx="14" cy="8" r="4" stroke="white" fill="none"/>
  <path d="M-18 32 a10 10 0 0 1 20 0 M-4 32 a10 10 0 0 1 20 0" stroke="white" fill="none"/>
</g>
<text x="580" y="44" font-family="Arial" font-size="26" fill="#8dc63f" font-weight="700">Gente</text>
<text x="580" y="68" font-family="Arial" font-size="18" fill="white">Trabalhadora e</text>
<text x="580" y="90" font-family="Arial" font-size="18" fill="white">acolhedora</text>

<!-- Column 2 -->
<g transform="translate(760,40)" stroke="white" fill="none" stroke-width="2">
  <path d="M0 35 C0 15 15 15 15 0"/>
  <path d="M0 35 C0 15 -15 15 -15 0"/>
  <path d="M0 35 L0 50"/>
  <path d="M-18 50 L18 50"/>
</g>
<text x="820" y="44" font-family="Arial" font-size="26" fill="#8dc63f" font-weight="700">Terras</text>
<text x="820" y="68" font-family="Arial" font-size="18" fill="white">Ricas em natureza</text>
<text x="820" y="90" font-family="Arial" font-size="18" fill="white">e produção</text>

<!-- Column 3 -->
<g transform="translate(1080,38)" stroke="white" fill="none" stroke-width="2">
  <path d="M0 0 a20 20 0 1 1 0 40"/>
  <line x1="0" y1="40" x2="0" y2="54"/>
  <line x1="-8" y1="54" x2="8" y2="54"/>
</g>
<text x="1115" y="44" font-family="Arial" font-size="26" fill="#8dc63f" font-weight="700">Inovação</text>
<text x="1115" y="68" font-family="Arial" font-size="18" fill="white">Que transforma</text>
<text x="1115" y="90" font-family="Arial" font-size="18" fill="white">realidades</text>

<!-- Column 4 -->
<g transform="translate(1335,35)" stroke="white" fill="none" stroke-width="2">
  <line x1="0" y1="40" x2="0" y2="10"/>
  <line x1="12" y1="40" x2="12" y2="20"/>
  <line x1="24" y1="40" x2="24" y2="0"/>
  <line x1="-4" y1="44" x2="30" y2="44"/>
  <line x1="24" y1="0" x2="34" y2="-10"/>
</g>
<text x="1375" y="44" font-family="Arial" font-size="24" fill="#8dc63f" font-weight="700">Futuro</text>
<text x="1375" y="68" font-family="Arial" font-size="16" fill="white">Que nasce do que</text>
<text x="1375" y="90" font-family="Arial" font-size="16" fill="white">plantamos hoje</text>
</svg>